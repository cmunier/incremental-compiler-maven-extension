name: CI & Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and verify with JaCoCo coverage
        run: mvn -B verify

      - name: Generate Coverage Summary in GitHub Actions Job Summary
        if: always() && hashFiles('target/site/jacoco/jacoco.csv') != ''
        run: |
          {
            echo "## JaCoCo Code Coverage Summary"
            echo ""
            echo "| Package | Class | Instruction Cov. | Branch Cov. | Lines Covered / Total |"
            echo "|---|---|---:|---:|---:|"
            awk -F',' 'NR>1 {
              inst_missed=$4; inst_cov=$5; inst_tot=inst_missed+inst_cov;
              br_missed=$6; br_cov=$7; br_tot=br_missed+br_cov;
              line_missed=$8; line_cov=$9; line_tot=line_missed+line_cov;
              sum_im+=inst_missed; sum_ic+=inst_cov;
              sum_bm+=br_missed; sum_bc+=br_cov;
              sum_lm+=line_missed; sum_lc+=line_cov;
              ip = (inst_tot > 0) ? (inst_cov * 100.0 / inst_tot) : 100.0;
              bp = (br_tot > 0) ? (br_cov * 100.0 / br_tot) : 100.0;
              printf "| `%s` | `%s` | %.1f%% | %.1f%% | %d / %d |\n", $2, $3, ip, bp, line_cov, line_tot;
            } END {
              tot_i = sum_im + sum_ic;
              tot_b = sum_bm + sum_bc;
              tot_l = sum_lm + sum_lc;
              tip = (tot_i > 0) ? (sum_ic * 100.0 / tot_i) : 100.0;
              tbp = (tot_b > 0) ? (sum_bc * 100.0 / tot_b) : 100.0;
              printf "| **Total** | **All Classes** | **%.1f%%** | **%.1f%%** | **%d / %d** |\n", tip, tbp, sum_lc, tot_l;
            }' target/site/jacoco/jacoco.csv
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish JaCoCo Coverage Comment to Pull Request
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          update-comment: true

      - name: Generate Coverage Badges
        uses: cicirello/jacoco-badge-generator@v2
        with:
          generate-branches-badge: true
          jacoco-csv-file: target/site/jacoco/jacoco.csv

      - name: Upload JaCoCo HTML Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
